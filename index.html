A correction to this morning's digest: one section was pulled after it went out. Please disregard that section; the rest of the digest is accurate.

An updated digest follows separately.`
          }),
          regen: () => ({ detail: "12 recipients · redrafted, still held" })
        }
      ],
    }
  };

  const ORDER = ["jira", "invoices", "docs", "digest"];
  let CURRENT = "jira";
  let S = null;

  /* ============================================================
     helpers
     ============================================================ */

  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function push(n) { $thread.appendChild(n); scrollDown(); return n; }
  function scrollDown() { requestAnimationFrame(() => { $scroll.scrollTop = $scroll.scrollHeight; }); }

  function syncFab() {
    const fab = document.getElementById("fab");
    if (!fab) return;
    const gap = $scroll.scrollHeight - $scroll.scrollTop - $scroll.clientHeight;
    fab.classList.toggle("show", gap > 120);
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function tierBadge(t) { return `<span class="tier t${t}">${t === 1 ? "T1 read" : t === 2 ? "T2 staged" : "T3 approval"}</span>`; }
  const STAR = `<svg class="star" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><g fill="var(--accent)"><rect x="11" y="2" width="2" height="20" rx="1"/><rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(30 12 12)"/><rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(60 12 12)"/><rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(90 12 12)"/><rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(120 12 12)"/><rect x="11" y="2" width="2" height="20" rx="1" transform="rotate(150 12 12)"/></g></svg>`;
  const CHECK = `<svg class="mk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;

  function msgActions() {
    return el(`<div class="msg-actions">
    <button aria-label="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
    <button aria-label="Read aloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></button>
    <button aria-label="Good response"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22V11l4-9a2.5 2.5 0 0 1 2.5 3l-1 5H19a2 2 0 0 1 2 2.4l-1.5 7A2 2 0 0 1 17.5 22z"/><path d="M7 11H3v11h4"/></svg></button>
    <button aria-label="Bad response"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2v11l-4 9a2.5 2.5 0 0 1-2.5-3l1-5H5a2 2 0 0 1-2-2.4l1.5-7A2 2 0 0 1 6.5 2z"/><path d="M17 13h4V2h-4"/></svg></button>
  </div>`);
  }

  function assistantTurn() {
    const t = el(`<div class="turn assistant"><div class="assistant-body"></div></div>`);
    push(t);
    return t.querySelector(".assistant-body");
  }
  function userTurn(inner) {
    push(el(`<div class="turn user"><div class="bubble">${inner}</div></div>`));
    push(el(`<div class="turn stamp"><span>just now</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></div>`));
  }

  function status(body, text) {
    const node = el(`<div class="status" aria-live="polite">${STAR}<span class="shimmer">${esc(text)}</span></div>`);
    body.appendChild(node); scrollDown();
    return {
      set(t) { const s = node.querySelector("span:last-child"); s.textContent = t; },
      finish(t) { node.innerHTML = `${CHECK}<span>${esc(t)}</span>`; },
      remove() { node.remove(); }
    };
  }

  /* ============================================================
     scenario lifecycle
     ============================================================ */

  function addOutput(name) {
    S.outputs = S.outputs || [];
    if (!S.outputs.includes(name)) S.outputs.push(name);
    paintPanel();
  }

  function paintPanel() {
    const n = (S && S.outputs) ? S.outputs.length : 0;
    const badge = document.getElementById("outCount");
    badge.textContent = n ? n : "";
    badge.style.display = n ? "inline" : "none";
    const list = document.getElementById("outList");
    list.innerHTML = n
      ? S.outputs.map(f => `<div class="panel-file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>${esc(f)}</div>`).join("")
      : `<div class="panel-empty">Files land here.</div>`;
    const p = document.getElementById("progList");
    if (S && S.stage !== "idle") {
      p.innerHTML = `<div class="panel-empty">${appliable().length} changes staged</div>`;
    } else {
      p.innerHTML = `<div class="panel-empty">Steps appear as Claude works.</div>`;
    }
  }

  function togglePanelSection(id) {
    document.getElementById(id).classList.toggle("open");
  }

  function renderTaskList() {
    document.getElementById("taskList").innerHTML = ORDER.map(id => {
      const s = SCENARIOS[id];
      return `<button class="task" ${id === CURRENT ? 'aria-current="true"' : ""} onclick="loadScenario('${id}')">
      <span class="tglyph-wrap">
        <svg class="tglyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l1.8 1.8L8 5"/><path d="M3 15.5l1.8 1.8L8 14"/><path d="M11 7h10M11 16h10"/></svg>
        <i class="tdot"></i>
      </span>
      <span class="tlabel">${esc(s.title)}<small>${esc(s.blurb)}</small></span></button>`;
    }).join("");
  }

  function loadScenario(id) {
    CURRENT = id;
    const sc = SCENARIOS[id];

    S = {
      sc,
      stage: "idle",
      live: false,
      revision: 0,
      criteria: [...sc.criteria],
      actions: sc.actions.map(a => ({ ...a, rejected: false, reason: "", dropped: false, regenerated: false })),
      byId: {},
      expanded: {},
      stagedCard: null
    };
    S.actions.forEach(a => { S.byId[a.id] = a; });

    $thread.innerHTML = "";
    $input.disabled = false;
    $input.value = sc.prompt;
    $send.disabled = false;
    document.getElementById("topTitle").textContent = sc.title;
    document.getElementById("hint").textContent = sc.tip;
    document.getElementById("tglParallel").checked = id === "digest";
    document.getElementById("modeBtn").disabled = false;
    syncChip();
    document.getElementById("hint").textContent = sandboxOn()
      ? sc.tip
      : "No staging in this mode — Claude writes as it works.";
    renderTaskList();
    paintPanel();
    scrollDown();
  }

  /* ============================================================
     flow
     ============================================================ */

  function startTask() {
    if (S.stage !== "idle") return;
    if (!sandboxOn()) {
      const t3 = MODE === "skip"
        ? "Sends and deletes will go through unprompted too."
        : "Claude will still stop before anything irreversible.";
      openPrompt({
        title: `Run in ${MODES[MODE].label} mode?`,
        tool: "jira.updateIssue · gmail.send · drive.deleteFile",
        text: "Claude will write to your workspace as it works. Nothing is staged for review first.",
        note: t3,
        ok: `Run in ${MODES[MODE].label}`,
        onOk: () => beginTask(true)
      });
      return;
    }
    beginTask(false);
  }

  function beginTask(live) {
    if (S.stage !== "idle") return;
    S.live = live;
    S.mode = MODE;
    S.prompts = 0;
    S.stage = "running";
    document.getElementById("modeBtn").disabled = true;
    $send.disabled = true;
    $input.value = "";
    $input.disabled = true;
    document.getElementById("hint").textContent = "Simulated — no connector is actually called.";
    userTurn(esc(S.sc.prompt));
    runPlan();
  }

  async function runPlan() {
    const body = assistantTurn();
    const st = status(body, "Planning…");
    await wait(900);
    st.remove();
    if (S.sc.scheduled) {
      body.appendChild(el(`<div class="note"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Scheduled task · ${esc(S.sc.scheduled)}</span></div>`));
    }
    body.appendChild(el(`<div class="prose">Here's the plan. Edit anything before I start.</div>`));
    body.appendChild(msgActions());
    renderContract(body);
  }

  function renderContract(body, editing = false) {
    const old = body.querySelector('[data-card="contract"]');
    if (old) old.remove();
    const items = S.criteria.map((c, i) => editing
      ? `<li><span class="box"></span><input type="text" value="${esc(c)}" data-crit="${i}" /></li>`
      : `<li><span class="box"></span><span>${esc(c)}</span></li>`).join("");

    const card = el(`<div class="card" data-card="contract">
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="card-title">Done contract</span><span class="card-sub">· ${S.criteria.length} checks</span>
    </div>
    <div class="card-body"><p class="goal">${esc(S.sc.goal)}</p><ul class="crit">${items}</ul></div>
    <div class="card-foot">
      ${editing ? `<button class="btn primary" data-act="save">Save criteria</button>`
        : `<button class="btn primary" data-act="accept">Accept and run</button><button class="btn" data-act="modify">Modify</button>`}
      <span class="foot-note">Claude checks its work against these</span>
    </div>
  </div>`);

    card.addEventListener("click", e => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "modify") renderContract(body, true);
      if (act === "save") { card.querySelectorAll("[data-crit]").forEach(i => { S.criteria[+i.dataset.crit] = i.value; }); renderContract(body, false); }
      if (act === "accept") {
        card.querySelector(".card-foot").innerHTML = `<span class="tier ok">Accepted</span><span class="foot-note">Locked</span>`;
        if (S.live) runLive(); else runSandbox();
      }
    });
    body.appendChild(card); scrollDown();
  }

  async function runLive() {
    const body = assistantTurn();
    const st = status(body, "Working…");
    await wait(650);

    const card = el(`<div class="card">
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h0"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span class="card-title">Live action ledger</span><span class="card-sub">· applying as it runs</span>
    </div><div class="ledger"></div></div>`);
    body.appendChild(card);
    S.ledgerCard = card;
    const ledger = card.querySelector(".ledger");

    let aborted = false;
    for (const e of S.sc.ledger) {
      await wait(340);

      /* Manual approves the intent, before there is anything to look at */
      if (e.tier === 2 && S.mode === "manual") {
        S.prompts++;
        const ok = await askPermission({
          title: "Claude wants to run an action",
          tool: `${e.call} · ${e.arg}`,
          text: "Claude hasn't run this yet.",
          note: "",
          ok: "Allow"
        });
        if (!ok) {
          ledger.appendChild(el(`<div class="row warn">${tierBadge(e.tier)}<span class="call">${esc(e.call)}</span><span class="arg">${esc(e.arg)}</span><span class="spread"></span><span class="tier no">denied</span></div>`));
          aborted = true;
          break;
        }
      }

      const applied = e.tier === 3 ? (S.mode === "skip" ? "applied" : "held for approval") : "applied";
      const cls = (e.tier === 3 && S.mode !== "skip") ? "arg" : "tier ok";
      ledger.appendChild(el(`<div class="row ${e.warn ? "warn" : ""}">${tierBadge(e.tier)}<span class="call">${esc(e.call)}</span><span class="arg">${esc(e.arg)}</span><span class="spread"></span><span class="${cls}">${esc(applied)}</span></div>`));
      scrollDown();
    }

    if (aborted) {
      st.finish("Stopped");
      body.appendChild(el(`<div class="note warn"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h0"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>The actions above already ran and can't be taken back.</span></div>`));
      S.applied = [];
      return;
    }

    st.finish(S.mode === "skip" ? "Done · everything applied" : "Done · changes are live");


    const fatigue = S.mode === "manual"
      ? `That took ${S.prompts} separate approvals.`
      : S.mode === "skip"
        ? `Nothing was asked, including the sends and deletes.`
        : `These changes are already in your workspace.`;
    body.appendChild(el(`<div class="note warn"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h0"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>${fatigue}</span></div>`));

    await wait(400);
    if (S.mode === "skip") { S.applied = appliable().slice(); doApply(); }
    else applyBatch();
  }

  async function runSandbox() {
    const body = assistantTurn();
    const parallel = document.getElementById("tglParallel").checked;
    const st = status(body, parallel ? "Staging… 1 of 3" : "Staging changes…");
    await wait(650);

    const card = el(`<div class="card">
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V9l7-5 7 5v11"/></svg>
      <span class="card-title">Action ledger</span><span class="card-sub">· nothing applied yet</span>
    </div><div class="ledger"></div></div>`);
    body.appendChild(card);
    S.ledgerCard = card;
    const ledger = card.querySelector(".ledger");

    for (const e of S.sc.ledger) {
      await wait(380);
      ledger.appendChild(el(`<div class="row ${e.warn ? "warn" : ""}">${tierBadge(e.tier)}<span class="call">${esc(e.call)}</span><span class="arg">${esc(e.arg)}</span><span class="spread"></span><span class="arg">${esc(e.note)}</span></div>`));
      scrollDown();
    }

    if (parallel) {
      st.set("Comparing 3 approaches…");
      await wait(900);
      body.appendChild(el(`<div class="card">
      <div class="card-head">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v3a6 6 0 0 1-6 6H9"/></svg>
        <span class="card-title">Sub-agent workstreams</span><span class="card-sub">· 3 run, best shown</span>
      </div>
      <div class="card-body"><div class="paths">${S.sc.workstreams.map(p => `<div class="path ${p.win ? "win" : ""}"><span class="name">${p.name}</span><span class="why">${esc(p.why)}</span><span class="score">${p.score}</span></div>`).join("")}</div></div>
    </div>`));
      scrollDown();
    }

    st.finish(parallel ? "Ran 3 approaches · showing the best" : "Done · nothing applied yet");
    await wait(450);
    emitStaged(true);
  }

  /* ============================================================
     staged changes
     ============================================================ */

  /* rejected actions leave the staged set entirely — the new revision is
     the plan as if they had never been proposed. Prior revisions keep their
     own static snapshot, so the audit trail survives. */
  function liveActions() { return S.actions.filter(a => !a.dropped && !a.rejected); }
  function appliable() { return liveActions().filter(a => !a.blocked && !a.pending && !a.pendingResolve); }

  function collapseCard(card, label) {
    if (!card || !card.isConnected) return;
    const wrapper = el(`<details class="superseded">
      <summary>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        ${label}
        <svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="inner"></div>
    </details>`);
    card.replaceWith(wrapper);
    wrapper.querySelector(".inner").appendChild(card);
  }

  function emitStaged(first) {
    S.revision++;
    if (S.ledgerCard) {
      collapseCard(S.ledgerCard, `Action ledger · ${S.sc.ledger.length} tool calls`);
      S.ledgerCard = null;
    }
    const body = assistantTurn();
    if (first) {
      const blocked = liveActions().filter(a => a.blocked).length;
      const n = appliable().length;
      body.appendChild(el(`<div class="prose">${n} change${n === 1 ? "" : "s"} staged. Nothing is applied yet.${blocked ? " Two rows need your input." : ""}</div>`));
    } else {
      body.appendChild(el(`<div class="prose">Updated with your feedback.</div>`));
    }
    const card = el(`<div class="card" data-card="staged"></div>`);
    body.appendChild(card);
    S.stagedCard = card;
    paintStaged();
    paintPanel();
    scrollDown();
  }

  function groupsOf() {
    const g = [];
    liveActions().forEach(a => { if (!g.includes(a.group)) g.push(a.group); });
    return g;
  }

  function emailBodyFor() {
    const t = liveTickets(S);
    const a7 = S.byId["a7"];
    const ownerLine = a7.rejected
      ? `Search relevance — <mark>${esc(a7.from)}</mark> (unchanged)`
      : `Search relevance — ${esc(a7.to)}`;
    const lines = t.map(x => "• " + esc(x.label.split(" for ")[0]) + " — " + esc((x.detail.match(/Assignee ([^·]+)/) || [, "—"])[1].trim()));
    const gapNote = t.length === 3
      ? `Three roadmap gaps were opened as ${t.map(x => x.key).join(", ")}.`
      : t.length ? `${t.length} roadmap gaps were opened as ${t.map(x => x.key).join(", ")}. <mark>One roadmap item is still untracked.</mark>`
        : `<mark>No roadmap gaps were ticketed.</mark>`;
    return `Team,

H2 scope is locked in Jira and every workstream now has a named owner.

${lines.join("\n")}
• ${ownerLine}

${gapNote} Backlog is reconciled as of today.`;
  }

  function itemHtml(a) {
    const kindMark = a.kind === "add" ? "+" : a.kind === "remove" ? "−" : "±";
    const kindLabel = a.kind === "add" ? "Add" : a.kind === "remove" ? "Remove" : "Update";

    let change;
    if (a.email) {
      change = `<div class="email" style="margin:0">
        <div class="subj">${esc(a.label)}</div>
        <div class="meta">${esc(a.detail)} ${tierBadge(a.tier)} send held until you allow it</div>
        <div class="body">${emailBodyFor()}</div>
      </div>`;
    } else if (a.from !== undefined) {
      change = `<span class="change"><span class="old">${esc(a.from)}</span><span class="arrow">→</span><span class="new">${esc(a.to)}</span>${a.detail ? `<span class="detail">${esc(a.detail)}</span>` : ""}</span>`;
    } else {
      change = `<span class="change"><span class="new">${esc(a.label)}</span>${a.detail ? `<span class="detail">${esc(a.detail)}</span>` : ""}</span>`;
    }

    const cls = a.pending ? "pending" : a.pendingResolve ? "resolving" : a.blocked ? "blocked" : a.regenerated || a.justResolved ? "regen" : "";
    const right = a.pendingResolve
      ? `<span class="flag">saved</span>`
      : a.blocked
        ? `<button class="btn sm" onclick="openResolve('${a.id}')">Resolve</button>`
        : a.pending
          ? `<span class="flag">rejecting</span>`
          : `<button class="rej" title="Reject this change" aria-label="Reject ${esc(a.key)}" onclick="openReject('${a.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

    let reasonRow = "";
    if (a.pending) {
      reasonRow = `<div class="reason">${a.reason ? esc(a.reason) : "<em>no reason given</em>"}<button class="undo-rej" onclick="unmarkReject('${a.id}')">Keep this change</button></div>`;
    } else if (a.pendingResolve) {
      reasonRow = `<div class="reason regen-note">Your input: ${esc(a.input)}<button class="undo-rej" onclick="unmarkResolve('${a.id}')">Discard</button></div>`;
    } else if (a.justResolved) {
      reasonRow = `<div class="reason regen-note">resolved from your input</div>`;
    } else if (a.regenerated) {
      reasonRow = `<div class="reason regen-note">updated</div>`;
    }

    const nDeps = dependentsOf(a.id).length;
    const depNote = nDeps ? `${nDeps} other change${nDeps === 1 ? "" : "s"} will update` : "Nothing else depends on this";

    const resolveForm = a.blocked ? `
      <div class="rejform" id="resform-${a.id}" style="display:none">
        <label class="inputlabel" for="in-${a.id}">${esc(a.inputLabel || "Provide the missing input")}</label>
        ${a.options
        ? `<select id="in-${a.id}">${a.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`
        : `<input type="text" id="in-${a.id}" placeholder="${esc(a.placeholder || "")}" />`}
        <div class="rowbtns">
          <button class="btn primary sm" onclick="markResolve('${a.id}')">Save</button>
          <button class="btn sm" onclick="closeResolve('${a.id}')">Cancel</button>
          <span class="hintline">${depNote}</span>
        </div>
      </div>` : "";

    const rejectForm = (!a.blocked && !a.pendingResolve) ? `
      <div class="rejform" id="form-${a.id}" style="display:none">
        <textarea id="why-${a.id}" placeholder="Why? Optional — Claude uses this when it redoes the work."></textarea>
        <div class="rowbtns">
          <button class="btn primary sm" onclick="markReject('${a.id}', true)">Reject</button>
          <button class="btn sm" onclick="closeReject('${a.id}')">Cancel</button>
          <span class="hintline">${depNote}</span>
        </div>
      </div>` : "";

    return `<div class="item ${cls}" id="item-${a.id}">
      <div class="item-main">
        <span class="kind ${a.kind}" title="${kindLabel}">${kindMark}</span>
        <span class="key">${esc(a.key)}</span>
        ${change}
        ${a.tier === 3 && !a.email ? tierBadge(3) : ""}
        ${right}
      </div>
      ${reasonRow}${resolveForm}${rejectForm}
    </div>`;
  }

  function paintStaged() {
    const card = S.stagedCard;
    if (!card) return;
    const live = liveActions();
    const ok = appliable();
    const pr = live.filter(a => a.pending);
    const ps = live.filter(a => a.pendingResolve);
    const blocked = live.filter(a => a.blocked).length;
    const t3 = ok.filter(a => a.tier === 3).length;
    const cascade = pendingCascade().length;
    const marked = pr.length + ps.length;
    const feedbackLabel = pr.length && ps.length
      ? `Regenerate with ${marked} edits`
      : pr.length ? `Reject ${pr.length} and regenerate`
        : `Regenerate with ${ps.length} resolved`;

    const groups = groupsOf().map(g => {
      const rows = live.filter(a => a.group === g);
      const isBig = rows.length > 6;
      const open = S.expanded[g];
      const shown = isBig && !open ? rows.slice(0, 5) : rows;
      const nOk = rows.filter(a => !a.rejected && !a.blocked).length;
      const defaultOpen = g !== "Assignee updates";
      return `<details class="group" ${defaultOpen ? "open" : ""}>
      <summary class="group-head">
        <span>${esc(g)}</span>
        <span class="count">${nOk} of ${rows.length} staged</span>
        <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="group-items">
        ${shown.map(itemHtml).join("")}
        ${isBig ? `<button class="btn sm" style="align-self:flex-start" onclick="toggleGroup('${esc(g)}')">${open ? "Show fewer" : "Show all " + rows.length}</button>` : ""}
      </div>
    </details>`;
    }).join("");

    card.innerHTML = `
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M4 8h6M4 16h6"/><path d="M14 12h6"/><path d="M17 9l3 3-3 3"/></svg>
      <span class="card-title">Staged changes</span>
      <span class="card-sub">· ${ok.length} change${ok.length === 1 ? "" : "s"}${pr.length ? ` · ${pr.length} to reject` : ""}${blocked ? ` · ${blocked} blocked` : ""}</span>
    </div>
    <div class="card-body">${groups}</div>
    <div class="card-foot">
      ${marked
        ? `<button class="btn primary" onclick="runFeedback()">${feedbackLabel}</button>
           <button class="btn" onclick="clearPending()">Clear marks</button>
           <span class="foot-note">${cascade} other change${cascade === 1 ? "" : "s"} will update</span>`
        : `<button class="btn primary" onclick="applyBatch()" ${ok.length ? "" : "disabled"}>Apply ${ok.length} change${ok.length === 1 ? "" : "s"}</button>
           <span class="foot-note">${blocked
          ? `${blocked} blocked · resolve to include`
          : `One approval covers all ${ok.length}`}</span>`}
    </div>`;
  }

  function toggleGroup(g) { S.expanded[g] = !S.expanded[g]; paintStaged(); }

  function openReject(id) {
    document.querySelectorAll(".rejform").forEach(f => f.style.display = "none");
    const f = document.getElementById("form-" + id);
    if (f) { f.style.display = "flex"; const t = document.getElementById("why-" + id); if (t) t.focus(); }
  }
  function closeReject(id) { const f = document.getElementById("form-" + id); if (f) f.style.display = "none"; }

  /* ============================================================
     dependency graph + regeneration
     ============================================================ */

  function dependentsOf(id) {
    const out = [];
    const walk = target => {
      liveActions().forEach(a => {
        if (a.rejected || out.includes(a.id) || a.id === id) return;
        if ((a.deps || []).includes(target)) { out.push(a.id); walk(a.id); }
      });
    };
    walk(id);
    return out;
  }

  /* union of everything downstream of the currently marked items */
  function pendingMarks() { return liveActions().filter(a => a.pending || a.pendingResolve); }

  function pendingCascade() {
    const marked = pendingMarks().map(a => a.id);
    const out = [];
    marked.forEach(id => dependentsOf(id).forEach(d => {
      if (!out.includes(d) && !marked.includes(d)) out.push(d);
    }));
    return out;
  }

  /* mark, don't regenerate — the user can audit the whole batch first */
  function markReject(id, withReason) {
    const a = S.byId[id];
    if (!a || a.rejected || a.pending) return;
    const ta = document.getElementById("why-" + id);
    a.reason = withReason && ta ? ta.value.trim() : "";
    a.pending = true;
    closeReject(id);
    paintStaged();
  }
  function unmarkReject(id) {
    const a = S.byId[id];
    if (!a) return;
    a.pending = false; a.reason = "";
    paintStaged();
  }

  /* blocked items take input through the same shape of control */
  function openResolve(id) {
    document.querySelectorAll(".rejform").forEach(f => f.style.display = "none");
    const f = document.getElementById("resform-" + id);
    if (f) { f.style.display = "flex"; const i = document.getElementById("in-" + id); if (i) i.focus(); }
  }
  function closeResolve(id) { const f = document.getElementById("resform-" + id); if (f) f.style.display = "none"; }

  function markResolve(id) {
    const a = S.byId[id];
    if (!a || !a.blocked) return;
    const field = document.getElementById("in-" + id);
    const v = field ? field.value.trim() : "";
    if (!v) { if (field) field.focus(); return; }
    a.input = v;
    a.pendingResolve = true;
    closeResolve(id);
    paintStaged();
  }
  function unmarkResolve(id) {
    const a = S.byId[id];
    if (!a) return;
    a.pendingResolve = false; a.input = "";
    paintStaged();
  }

  function clearPending() {
    liveActions().forEach(a => { a.pending = false; a.reason = ""; a.pendingResolve = false; a.input = ""; });
    paintStaged();
  }

  async function runFeedback() {
    const rejects = liveActions().filter(a => a.pending);
    const resolves = liveActions().filter(a => a.pendingResolve);
    if (!rejects.length && !resolves.length) return;
    const deps = pendingCascade();

    rejects.forEach(a => { a.pending = false; a.rejected = true; });
    resolves.forEach(a => {
      a.pendingResolve = false;
      a.blocked = false;
      a.resolved = true;
      a.justResolved = true;
      a.resolvedRev = S.revision + 1;
      if (a.resolve) Object.assign(a, a.resolve(a.input));
      a.group = S.sc.resolvedGroup || a.group;
    });

    /* 1 — collapse the revision the user was auditing */
    collapseStaged();

    /* 2 — the whole batch reads as one message from the person */
    const rejRows = rejects.map(a => {
      const label = a.email ? a.label : (a.label || `${a.from} → ${a.to}`);
      return `<div class="rej-item"><span class="what">${esc(a.key)} · ${esc(label)}</span>
      <span class="why ${a.reason ? "" : "none"}">${a.reason ? esc(a.reason) : "No reason given"}</span></div>`;
    }).join("");
    const resRows = resolves.map(a => `<div class="rej-item">
      <span class="what">${esc(a.key)} · ${esc(a.inputLabel || "input provided")}</span>
      <span class="why">${esc(a.input)}</span></div>`).join("");

    const head = [];
    if (rejects.length) head.push(`Rejected ${rejects.length}`);
    if (resolves.length) head.push(`Resolved ${resolves.length} blocked`);
    userTurn(`
    <div class="rej-head">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 6h10M4 18h7"/></svg>
      ${head.join(" · ")}
    </div>${rejRows}${resRows}`);

    /* 3 — Claude replays the union of everything downstream */
    const marked = [...rejects, ...resolves];
    const keys = marked.map(a => a.key);
    const body = assistantTurn();
    const st = status(body, `Rewinding to before ${keys[0]}…`);
    await wait(850);

    const steps = el(`<div class="steps"></div>`);
    body.appendChild(steps);

    for (const a of resolves) {
      const row = el(`<div class="step">${STAR}<span><span class="shimmer">Adding ${esc(a.key)}…</span><span class="sub">was blocked</span></span></div>`);
      steps.appendChild(row); scrollDown();
      await wait(700);
      row.innerHTML = `${CHECK}<span>${esc(a.key)} added<span class="sub">${esc(a.detail)}</span></span>`;
      scrollDown();
    }

    if (deps.length) {
      st.set(`Updating ${deps.length} dependent change${deps.length === 1 ? "" : "s"}…`);
      for (const did of deps) {
        const d = S.byId[did];
        const causes = (d.deps || []).filter(x => marked.some(m => m.id === x)).map(x => S.byId[x].key);
        const why = causes.length ? `depends on ${causes.join(", ")}` : "depends on an updated change";
        const row = el(`<div class="step">${STAR}<span><span class="shimmer">Updating ${esc(d.group)} · ${esc(d.key)}…</span><span class="sub">${esc(why)}</span></span></div>`);
        steps.appendChild(row); scrollDown();
        await wait(760);

        let summary = "updated";
        if (d.regen) {
          const patch = d.regen(S);
          if (patch.dropped) { d.dropped = true; summary = patch.note || "dropped"; }
          else { Object.assign(d, patch); summary = patch.detail || patch.to || "updated"; }
        } else if (d.email) {
          summary = "owners and ticket list rewritten from the surviving actions";
        }
        d.regenerated = true;
        d.regenRev = S.revision + 1;
        row.innerHTML = `${CHECK}<span>${esc(d.group)} · ${esc(d.key)}<span class="sub">${esc(summary)}</span></span>`;
        scrollDown();
      }
    }

    const preserved = appliable().length - deps.filter(x => !S.byId[x].dropped).length - resolves.length;
    st.finish(deps.length
      ? `Updated ${deps.length} change${deps.length === 1 ? "" : "s"}`
      : "Updated");

    body.appendChild(el(`<div class="note"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v3a6 6 0 0 1-6 6H9"/></svg><span>The other ${Math.max(preserved, 0)} changes were left as they were.</span></div>`));

    await wait(400);
    liveActions().forEach(a => { if (!resolves.includes(a)) a.justResolved = false; });
    emitStaged(false);
  }

  function collapseStaged() {
    const card = S.stagedCard;
    if (!card) return;
    const ok = appliable().length;
    const wrapper = el(`<details class="superseded">
      <summary>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Revision ${S.revision} · superseded · ${ok} actions
        <svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="inner"></div>
    </details>`);
    card.replaceWith(wrapper);
    card.dataset.card = "staged-old";
    card.querySelectorAll(".rejform, .rej, .group-items .btn").forEach(n => n.remove());
    card.querySelector(".card-foot")?.remove();
    wrapper.querySelector(".inner").appendChild(card);
    S.stagedCard = null;
  }

  /* ============================================================
     apply
     ============================================================ */

  function applyBatch() {
    const ok = appliable();
    const t3 = ok.filter(a => a.tier === 3);
    if (!t3.length) return doApply();
    const first = t3[0];
    const tool = S.sc.id === "docs" ? "drive.deleteFile · 4 files"
      : S.sc.id === "invoices" ? "netsuite.postJournalEntry · JE-Q3-payroll"
        : S.sc.id === "digest" ? "gmail.send · exec-staff@ (12 recipients)"
          : "gmail.send · eng-leads@ (7 recipients)";
    const title = S.sc.id === "docs" ? "Claude wants to delete 4 files"
      : S.sc.id === "invoices" ? "Claude wants to post a journal entry"
        : "Claude wants to send an email";
    openPrompt({
      title, tool,
      text: `Applies all ${ok.length} staged change${ok.length === 1 ? "" : "s"}.`,
      note: S.sc.id === "docs"
        ? "Deleted files leave your Drive for good."
        : `${t3.length} of these can't be taken back.`,
      ok: "Allow", onOk: doApply
    });
  }

  async function doApply() {
    const ok = appliable();
    S.applied = ok.slice();
    const body = assistantTurn();
    const st = status(body, "Applying…");
    await wait(1300);
    st.finish(`Applied ${ok.length} change${ok.length === 1 ? "" : "s"}`);

    const byGroup = {};
    ok.forEach(a => { byGroup[a.group] = (byGroup[a.group] || 0) + 1; });
    const rows = Object.entries(byGroup).map(([g, n]) => {
      const tier = Math.max(...ok.filter(a => a.group === g).map(a => a.tier));
      return `<div class="row">${tierBadge(tier)}<span class="call">${esc(g)}</span><span class="arg">×${n}</span><span class="spread"></span><span class="tier ok">${tier === 3 ? "sent" : "done"}</span></div>`;
    }).join("");

    body.appendChild(el(`<div class="card">
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="card-title">Applied to your workspace</span>
      <span class="card-sub">· ${ok.length} change${ok.length === 1 ? "" : "s"}</span>
    </div><div class="ledger">${rows}</div></div>`));

    body.appendChild(el(`<div class="file">
    <span class="ficon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
    <span style="flex:1"><span class="fname">${esc(S.sc.id)}-run-summary.md</span><span class="fmeta">Delivered to this task</span></span>
    <button class="inline-btn">Preview</button><button class="inline-btn">Download</button>
  </div>`));

    if (S.stagedCard) S.stagedCard.querySelector(".card-foot").innerHTML = `<span class="tier ok">Applied</span><span class="foot-note">Applied</span>`;

    body.appendChild(el(`<div class="note"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>These changes are live and can't be taken back.</span></div>`));
    addOutput(`${S.sc.id}-run-summary.md`);
    const nr = notReversibleCard();
    if (nr) body.appendChild(nr);

    scrollDown();
  }

  function notReversibleCard() {
    const t3 = (S.applied || []).filter(a => a.tier === 3);
    if (!t3.length) return null;
    const rows = t3.map(a => {
      const sent = typeof a.sent === "function" ? a.sent(S) : (a.sent || `${a.key} · ${a.label}`);
      return `<div class="irrev">
      <div class="irrev-what">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        <span>${esc(sent)}</span>
      </div>
      ${a.remedy ? `<button class="btn sm" onclick="draftCorrection('${a.id}')">${esc(a.remedy)}</button>` : ""}
    </div>`;
    }).join("");

    return el(`<div class="card">
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h0"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span class="card-title">Left your workspace</span>
      <span class="card-sub">· ${t3.length} action${t3.length === 1 ? "" : "s"} others can already see</span>
    </div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:8px">${rows}</div>
  </div>`);
  }

  function sendCorrection(btn) {
    const foot = btn.closest(".card-foot");
    foot.innerHTML = `<span class="tier ok">Approved and sent</span><span class="foot-note">Sent</span>`;
  }

  async function draftCorrection(id) {
    const a = S.byId[id];
    if (!a || !a.correction) return;
    const c = typeof a.correction === "function" ? a.correction(S) : a.correction;
    const body = assistantTurn();
    const st = status(body, "Drafting…");
    await wait(1000);
    st.finish("Correction drafted");
    body.appendChild(el(`<div class="card">
    <div class="card-head">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span class="card-title">Correction staged</span>
      <span class="card-sub">· corrects ${esc(a.key)}</span>
    </div>
    <div class="card-body">
      <div class="email" style="margin:0">
        <div class="subj">${esc(c.title)}</div>
        <div class="meta">${esc(c.meta)}</div>
        <div class="body">${esc(c.body)}</div>
      </div>
    </div>
    <div class="card-foot">
      <button class="btn primary" onclick="sendCorrection(this)">Allow and send</button>
      <button class="btn" onclick="this.closest('.card').remove()">Discard</button>
      <span class="foot-note">Not sent yet</span>
    </div>
  </div>`));
    scrollDown();
  }

  /* ============================================================
     chrome
     ============================================================ */

  const $dlg = document.getElementById("dlg");

  function askPermission(opts) {
    return new Promise(resolve => {
      openPrompt({ ...opts, onOk: () => resolve(true) });
      document.getElementById("dlgNo").onclick = () => { $dlg.close(); resolve(false); };
    });
  }



  function openPrompt({ title, tool, text, note, ok, onOk }) {
    document.getElementById("dlgTitle").textContent = title;
    document.getElementById("dlgTool").textContent = tool;
    document.getElementById("dlgText").textContent = text;
    const n = document.getElementById("dlgNote");
    n.textContent = note || ""; n.style.display = note ? "block" : "none";
    const b = document.getElementById("dlgOk");
    b.textContent = ok; b.onclick = () => { $dlg.close(); onOk(); };
    document.getElementById("dlgNo").onclick = () => $dlg.close();
    $dlg.showModal();
  }

  function togglePop(e) { e.stopPropagation(); document.getElementById("pop").classList.toggle("open"); }
  document.addEventListener("click", e => {
    const pop = document.getElementById("pop");
    if (pop.classList.contains("open") && !pop.contains(e.target) && !e.target.closest("#popBtn")) pop.classList.remove("open");
    const m = document.getElementById("modeMenu");
    if (m.classList.contains("open") && !m.contains(e.target) && !e.target.closest("#modeBtn")) {
      m.classList.remove("open");
      document.getElementById("modeBtn").setAttribute("aria-expanded", "false");
    }
  });

  let MODE = "staging";
  const ICON = {
    manual: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11"/><path d="M15 10.5V4.5a1.5 1.5 0 0 0-3 0V11"/><path d="M12 10.5V5.5a1.5 1.5 0 0 0-3 0V13"/><path d="M9 12V8.5a1.5 1.5 0 0 0-3 0V14a7 7 0 0 0 7 7h1a5 5 0 0 0 5-5v-5"/></svg>`,
    staging: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.6 3.4a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M4 21.4h8"/></svg>`,
    auto: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l8 7-8 7z"/><path d="M13 5l8 7-8 7z"/></svg>`,
    skip: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 16h0"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>`
  };

  const MODES = {
    manual: { label: "Manual", chip: "Manual · asks before each action" },
    staging: { label: "Staging", chip: "Staging · nothing applied yet" },
    auto: { label: "Auto", chip: "Auto · applying as it works" },
    skip: { label: "Skip", chip: "Skip all · no prompts" }
  };

  function sandboxOn() { return MODE === "staging"; }

  const NOTICE = {
    manual: { title: "Manually approve is on.", body: `Claude pauses before every action so you can approve it. This includes using <u>your connectors</u> and Claude in Chrome, unless you turn them off.` },
    staging: { title: "Stage changes is on.", body: `Claude works through the whole task, then pauses once so you can review every change before anything is applied. This includes using <u>your connectors</u> and Claude in Chrome, unless you turn them off.` },
    auto: { title: "Automatically approve is on.", body: `Claude runs on its own and pauses if anything looks unsafe. This includes using <u>your connectors</u> and Claude in Chrome, unless you turn them off.` },
    skip: { title: "Skip all approvals is on.", body: `Claude never pauses, even for unsafe actions. This includes using <u>your connectors</u> and Claude in Chrome, unless you turn them off.` }
  };

  let noticeDismissed = false;

  function paintNotice() {
    const box = document.getElementById("notice");
    if (!box) return;
    if (noticeDismissed) { box.hidden = true; return; }
    const n = NOTICE[MODE];
    box.hidden = false;
    document.getElementById("noticeTitle").textContent = n.title;
    document.getElementById("noticeBody").innerHTML = n.body;
  }

  function dismissNotice() {
    noticeDismissed = true;
    document.getElementById("notice").hidden = true;
  }

  function toggleModeMenu(e) {
    e.stopPropagation();
    const m = document.getElementById("modeMenu");
    const open = m.classList.toggle("open");
    document.getElementById("modeBtn").setAttribute("aria-expanded", open ? "true" : "false");
  }

  function setMode(m) {
    MODE = m;
    document.getElementById("modeMenu").classList.remove("open");
    document.getElementById("modeBtn").setAttribute("aria-expanded", "false");
    syncChip();
    if (S && S.stage === "idle") {
      document.getElementById("hint").textContent = sandboxOn()
        ? S.sc.tip
        : "No staging in this mode — Claude writes as it works.";
    }
  }

  function syncChip() {
    const on = sandboxOn();
    const par = document.getElementById("tglParallel").checked;

    document.getElementById("modeLabel").textContent = MODES[MODE].label;
    document.getElementById("modeGlyph").innerHTML = ICON[MODE];
    paintNotice();
    document.getElementById("modeBtn").classList.toggle("warn", MODE === "skip");
    Object.keys(MODES).forEach(m => {
      const t = document.getElementById("tick-" + m);
      if (t) t.style.visibility = (m === MODE) ? "visible" : "hidden";
      const r = document.getElementById("row-" + m);
      if (r) r.classList.toggle("sel-row", m === MODE);
    });
    document.querySelector(".composer").classList.toggle("live", !on);

  }

  document.getElementById("tglParallel").addEventListener("change", syncChip);

  $input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); startTask(); }
  });

  /* ============================================================
     Brand font assignment
  
     The three woff2 files are hash-named, so nothing identifies which is the
     sans and which is the serif. Each is registered as BrandA/B/C, then
     classified here by rendering a capital I and comparing the ink width at
     the top of the glyph against the stem width at its middle. A serif I has
     wide slabs top and bottom and a narrow stem; a sans I is a uniform bar.
     Anything that fails to load is skipped and the system stacks stand.
     ============================================================ */

  function glyphMetrics(family) {
    try {
      const S = 220, c = document.createElement("canvas");
      c.width = c.height = S;
      const x = c.getContext("2d", { willReadFrequently: true });
      x.fillStyle = "#fff"; x.fillRect(0, 0, S, S);
      x.fillStyle = "#000"; x.textBaseline = "top";
      x.font = `160px "${family}"`;
      x.fillText("I", 40, 20);

      const d = x.getImageData(0, 0, S, S).data;
      const rowWidth = y => {
        let lo = -1, hi = -1;
        for (let px = 0; px < S; px++) {
          if (d[(y * S + px) * 4] < 128) { if (lo < 0) lo = px; hi = px; }
        }
        return hi < 0 ? 0 : hi - lo + 1;
      };

      let top = -1, bottom = -1;
      for (let y = 0; y < S; y++) { if (rowWidth(y) > 0) { if (top < 0) top = y; bottom = y; } }
      if (top < 0 || bottom - top < 30) return null;

      const h = bottom - top;
      const capWidth = rowWidth(top + Math.round(h * 0.04));
      const stemWidth = rowWidth(top + Math.round(h * 0.5));
      if (!stemWidth) return null;
      return { serifRatio: capWidth / stemWidth, stem: stemWidth / h };
    } catch (e) { return null; }
  }

  async function assignBrandFonts() {
    if (!document.fonts || !document.fonts.load) return;
    const candidates = ["BrandA", "BrandB", "BrandC"];
    const measured = [];

    for (const fam of candidates) {
      try {
        await document.fonts.load(`160px "${fam}"`);
        if (!document.fonts.check(`160px "${fam}"`)) continue;
        const m = glyphMetrics(fam);
        if (m) measured.push({ fam, ...m });
      } catch (e) { /* unreachable font — leave the system stack alone */ }
    }
    if (!measured.length) return;

    /* serifRatio near 1 is a plain bar; a serifed I runs well above 1.6 */
    const serifs = measured.filter(m => m.serifRatio > 1.6).sort((a, b) => b.serifRatio - a.serifRatio);
    const sans = measured.filter(m => m.serifRatio <= 1.6).sort((a, b) => a.stem - b.stem);

    const root = document.documentElement.style;
    if (sans.length) root.setProperty("--ui", `"${sans[0].fam}", var(--fallback-ui)`);
    if (serifs.length) root.setProperty("--serif", `"${serifs[0].fam}", var(--fallback-serif)`);

    /* kept on window for inspection if the assignment ever looks wrong */
    window.__brandFonts = measured.map(m => `${m.fam}: serifRatio ${m.serifRatio.toFixed(2)}, stem ${m.stem.toFixed(3)}`);
  }

  assignBrandFonts();

  $scroll.addEventListener("scroll", syncFab);
  paintNotice();
  loadScenario("jira");
</script>
